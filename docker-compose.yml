# Development environment for this package.
# The package root is mounted at /workspace and every command runs from there,
# so paths resolved with here::here() behave the same in any checkout.
#
#   docker compose build        # first run, or after changing docker/r/Dockerfile
#   npm run r:test              # any r:* script in package.json
services:
  # Optional RStudio Server on http://localhost:8787 (docker compose up r-indicators)
  r-indicators:
    build:
      context: .
      dockerfile: docker/r/Dockerfile
    image: dss-data-r:latest
    user: root
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      # Docker uses the R packages installed in the image; renv is for local R.
      - RENV_CONFIG_AUTOLOADER_ENABLED=FALSE
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:8787:8787"
    command: >
      bash -c "
        if command -v rstudio-server >/dev/null 2>&1; then
          echo 'auth-minimum-user-id=0' >> /etc/rstudio/rserver.conf &&
          rstudio-server start &&
          echo 'RStudio Server started on port 8787'
        fi &&
        R --slave --no-restore --no-save
      "

  # Used by the npm r:* scripts (docker compose run --rm r-dev ...)
  r-dev:
    build:
      context: .
      dockerfile: docker/r/Dockerfile
    image: dss-data-r:latest
    user: root
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - RENV_CONFIG_AUTOLOADER_ENABLED=FALSE
    command: R
    tty: true
    stdin_open: true
    profiles:
      - dev
